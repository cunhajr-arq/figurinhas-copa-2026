<style>
  :root { color-scheme: dark; }
  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: auto; }
  body { background: #030305; overflow-x: hidden; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1c1f28; border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: #00e5ff44; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  /* ---------- Glass ---------- */
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255,255,255,.09);
  }
  .glass-deep {
    background: linear-gradient(160deg, rgba(18,20,26,.82), rgba(8,9,12,.92));
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,.08);
  }

  /* ---------- Grain ---------- */
  .grain::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 90; opacity: .05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ---------- Keyframes ---------- */
  @keyframes popSpring {
    0%   { transform: scale(.78); }
    45%  { transform: scale(1.12); }
    70%  { transform: scale(.96); }
    100% { transform: scale(1); }
  }
  .anim-pop { animation: popSpring .55s cubic-bezier(.2,1.6,.35,1) both; }

  @keyframes badgePop {
    0%   { transform: scale(0) rotate(-30deg); }
    60%  { transform: scale(1.35) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .anim-badge { animation: badgePop .45s cubic-bezier(.2,1.8,.4,1) both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .anim-fadeup { animation: fadeUp .7s cubic-bezier(.16,1,.3,1) both; }

  @keyframes slideL { from { opacity:0; transform: translateX(46px);} to { opacity:1; transform:none;} }
  @keyframes slideR { from { opacity:0; transform: translateX(-46px);} to { opacity:1; transform:none;} }
  .anim-slideL { animation: slideL .42s cubic-bezier(.16,1,.3,1) both; }
  .anim-slideR { animation: slideR .42s cubic-bezier(.16,1,.3,1) both; }

  @keyframes modalIn {
    0%   { opacity: 0; transform: translateY(64px) scale(.92); }
    60%  { opacity: 1; transform: translateY(-8px) scale(1.012); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .anim-modal { animation: modalIn .5s cubic-bezier(.2,1.3,.4,1) both; }

  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  .anim-backdrop { animation: backdropIn .3s ease both; }

  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(var(--rot,0deg)); }
    50%     { transform: translateY(-18px) rotate(calc(var(--rot,0deg) + 4deg)); }
  }
  .anim-float { animation: floaty 7s ease-in-out infinite; }

  @keyframes pulseGlow {
    0%,100% { opacity:.55; transform: scale(1); }
    50%     { opacity:.9;  transform: scale(1.12); }
  }
  .anim-glow { animation: pulseGlow 5s ease-in-out infinite; }

  @keyframes holo {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  @keyframes shineSweep {
    0%   { transform: translateX(-130%) skewX(-18deg); }
    100% { transform: translateX(230%) skewX(-18deg); }
  }

  @keyframes ticker { from { transform: translateX(0);} to { transform: translateX(-50%);} }
  .anim-ticker { animation: ticker 28s linear infinite; }

  /* ---------- Figurinha (moldura Panini) ---------- */
  .sticker-tilt {
    transform-style: preserve-3d;
    transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s ease;
    will-change: transform;
  }
  .frame-common {
    background: linear-gradient(165deg, #f6f0e0, #ddd3bc);
    box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 14px 28px -14px rgba(0,0,0,.9), 0 0 18px -8px rgba(0,229,255,.25);
  }
  .frame-shiny {
    background: linear-gradient(160deg, #f2f3f8, #aeb6c6 45%, #e8ebf2 70%, #8d96a8);
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 14px 28px -14px rgba(0,0,0,.9), 0 0 22px -6px rgba(0,229,255,.45);
  }
  .frame-legend {
    background: linear-gradient(100deg,#00e5ff,#00ff87,#b96bff,#ffd166,#00e5ff);
    background-size: 220% 100%;
    animation: holo 3.2s linear infinite;
    box-shadow: 0 14px 28px -14px rgba(0,0,0,.9), 0 0 26px -4px rgba(0,255,135,.5);
  }
  .stripes {
    background-image: repeating-linear-gradient(125deg, rgba(255,255,255,.085) 0 10px, transparent 10px 26px);
  }
  .shine::before {
    content:''; position:absolute; inset:0; z-index:5; pointer-events:none;
    background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,.25) 50%, transparent 70%);
    transform: translateX(-130%) skewX(-18deg);
  }
  .group-card:hover .shine::before { animation: shineSweep 1s ease; }

  /* ---------- Progress bar fill ---------- */
  .bar-fill { transition: width 1.1s cubic-bezier(.16,1,.3,1); }

  .text-stroke {
    -webkit-text-stroke: 1.5px rgba(0,229,255,.4);
    color: transparent;
  }

  .chev { transition: transform .3s cubic-bezier(.16,1,.3,1); }
  .chev.open { transform: rotate(90deg); }

  .no-select { user-select: none; -webkit-user-select: none; }
</style>

function usePersistedCounts() {
  const [counts, setCounts] = useState(() => {
    try {
      const raw = localStorage.getItem('stickr26-v2');
      return raw ? JSON.parse(raw) : INITIAL_COUNTS;
    } catch { return INITIAL_COUNTS; }
  });
  useEffect(() => {
    try { localStorage.setItem('stickr26-v2', JSON.stringify(counts)); } catch {}
  }, [counts]);
  return [counts, setCounts];
}

function useScrollY(active) {
  const [y, setY] = useState(0);
  useEffect(() => {
    if (!active) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setY(window.scrollY));
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, [active]);
  return y;
}

/* ================================================================
   FIGURINHA — moldura Panini + tilt 3D + estados + spring
================================================================ */
function StickerCard({ sticker, count, onInc, onDec, compact }) {
  const ref = useRef(null);
  const [popKey, setPopKey] = useState(0);
  const [badgeKey, setBadgeKey] = useState(0);
  const longPress = useRef({ timer: null, fired: false });

  const owned = count > 0;
  const dupes = Math.max(0, count - 1);
  const { team, rarity } = sticker;

  /* tilt de perspectiva */
  const handleMove = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(700px) rotateY(${px * 16}deg) rotateX(${-py * 16}deg) scale(1.04) translateZ(0)`;
  };
  const handleLeave = () => {
    const el = ref.current; if (el) el.style.transform = '';
  };

  /* clique = incrementa · long-press = decrementa */
  const startPress = () => {
    longPress.current.fired = false;
    longPress.current.timer = setTimeout(() => {
      longPress.current.fired = true;
      if (count > 0) { onDec(sticker.id); if (navigator.vibrate) navigator.vibrate(18); }
    }, 480);
  };
  const endPress = () => clearTimeout(longPress.current.timer);
  const handleClick = () => {
    if (longPress.current.fired) return;
    onInc(sticker.id);
    setPopKey(k => k + 1);
    if (count >= 1) setBadgeKey(k => k + 1);
    if (navigator.vibrate) navigator.vibrate(8);
  };

  const isLegend = rarity === 'legend';
  const isShiny = rarity === 'shiny';
  const frameClass = isLegend ? 'frame-legend' : isShiny ? 'frame-shiny' : 'frame-common';

  return (
    <div className={`relative ${compact ? '' : 'group-card'}`} style={{ perspective:'700px' }}>
      <button
        ref={ref}
        onMouseMove={!compact ? handleMove : undefined}
        onMouseLeave={!compact ? handleLeave : undefined}
        onPointerDown={startPress}
        onPointerUp={endPress}
        onPointerCancel={endPress}
        onContextMenu={(e) => e.preventDefault()}
        onClick={handleClick}
        key={popKey}
        className={`sticker-tilt anim-pop relative w-full aspect-[3/4] rounded-xl text-left no-select
          ${owned ? `${frameClass} p-[5px] shine overflow-hidden` : 'border-2 border-dashed border-white/[.12] bg-white/[.015] overflow-hidden'}`}
        style={{ transformOrigin:'center' }}
        aria-label={`${sticker.label} — ${team.name}`}
      >
        {owned ? (
          /* ============ FIGURINHA COLADA (estilo Panini) ============ */
          <div className="relative h-full w-full rounded-[7px] overflow-hidden flex flex-col"
               style={{ background:`linear-gradient(155deg, ${team.c1} -20%, ${team.c2} 75%)` }}>
            <div className="stripes absolute inset-0 pointer-events-none"/>
            <div className="absolute inset-0 pointer-events-none" style={{ background:'radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255,255,255,.22), transparent 60%)' }}/>

            {/* topo: número + raridade */}
            <div className="relative flex items-start justify-between px-2 pt-1.5">
              <span className="font-mono font-bold text-[10px] px-1.5 py-0.5 rounded bg-black/45 text-white/90">
                {sticker.codeLabel}
              </span>
              {isShiny && <span className="text-white drop-shadow"><Icon.spark width="13" height="13"/></span>}
              {isLegend && <span className="text-yellow-200 drop-shadow"><Icon.spark width="15" height="15"/></span>}

    !query || norm(t.name).includes(query) || t.code.toLowerCase().includes(query) ||
    ROSTER[t.code].some(n => norm(n).includes(query));

  const toggle = (code) => setOpen(o => ({ ...o, [code]: !o[code] }));

  const renderTeam = (team, ti) => (
    <TeamSection
      key={team.code}
      team={team}
      counts={counts}

      onDec={onDec}
      open={!!open[team.code] || !!query}

  if (sort === 'az') {

      .filter(t => (group === 'Todas' || t.group === group) && matchTeam(t))

    const blocks = GROUP_DEFS
      .filter(d => group === 'Todas' || group === d.key)

          <div key={def.key}>
            <div className="flex items-center gap-3 mt-6 mb-3 px-1 first:mt-0">
              <span className="font-display font-extrabold text-[12px] uppercase tracking-[.3em] text-cyan26">{def.title}</span>

            </div>

    body = blocks;
  }

  return (
    <div className="px-4 pb-10 max-w-2xl lg:max-w-5xl 2xl:max-w-7xl mx-auto">
      <div className="glass rounded-xl px-4 py-2.5 mb-4 flex items-center gap-3 text-[11px] text-dim">

            onChange={e => setQ(e.target.value)}
            placeholder="Buscar seleção ou jogador…"
            className="bg-transparent outline-none w-full text-[14px] placeholder:text-dim/60"
          />
          {q && (
            <button onClick={() => setQ('')} className="text-dim hover:text-white shrink-0"><Icon.close width="14" height="14"/></button>
          )}

        <div className="glass rounded-2xl p-1 flex items-center shrink-0">
          {[['grupo','Grupos'],['az','A–Z']].map(([key, label]) => (
            <button key={key} onClick={() => setSort(key)}
                    className={`font-mono text-[11px] uppercase tracking-wider px-3 py-2 rounded-xl transition-all duration-300
                      ${sort === key ? 'bg-cyan26/15 text-cyan26 border border-cyan26/40' : 'text-dim hover:text-white/80 border border-transparent'}`}>

          <button key={d.key} onClick={() => setGroup(d.key === group ? 'Todas' : d.key)}
                  className={`shrink-0 font-mono text-[11px] uppercase tracking-wider px-3.5 py-1.5 rounded-full border transition-all duration-300 active:scale-95

      {total === 0 && (
        <div className="anim-fadeup glass rounded-2xl py-14 flex flex-col items-center gap-3 text-dim">

    </div>
  );
}

/* ================================================================
   ALGORITMO DE MATCH
================================================================ */
function computeMatch(friend, counts) {
  const youReceive = friend.has.filter(id => (counts[id] || 0) === 0);          // ele tem ∧ eu preciso
  const youSend    = friend.needs.filter(id => (counts[id] || 0) >= 2);         // ele precisa ∧ tenho repetida
  const pairs = Math.min(youReceive.length, youSend.length);
  const pool = friend.has.length + friend.needs.length;
  const pct = pool === 0 ? 0 : Math.min(100, Math.round(((youReceive.length + youSend.length) / pool) * 100));
  return { youReceive, youSend, pairs, pct };
}

function MatchCard({ friend, match, onOpen, delay }) {
  const [fill, setFill] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setFill(match.pct), 180 + delay);
    return () => clearTimeout(t);
  }, [match.pct, delay]);

  return (
    <button
      onClick={() => onOpen(friend)}
      className="anim-fadeup w-full glass rounded-2xl p-4 text-left transition-all duration-300 hover:border-white/20 hover:-translate-y-0.5 active:scale-[.985]"
      style={{ animationDelay:`${delay}ms` }}
    >

        <div className="relative shrink-0 w-12 h-12 rounded-2xl flex items-center justify-center text-xl"
             style={{ background:`linear-gradient(140deg, ${friend.color}33, ${friend.color}0d)`, border:`1px solid ${friend.color}55` }}>
          {friend.emoji}
          {match.pairs > 0 && <span className="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-neon animate-pulse" style={{ boxShadow:'0 0 8px #00ff87' }}/>}
        </div>

        <div className="flex-1 min-w-0">
          <div className="flex items-baseline justify-between gap-2">
            <span className="font-display font-semibold text-[15px]">{friend.name}</span>
            <span className="font-mono font-bold text-base" style={{ color: friend.color }}>{match.pct}%</span>
          </div>
          <div className="mt-1.5 h-1.5 rounded-full bg-white/[.07] overflow-hidden">
            <div className="bar-fill h-full rounded-full"
                 style={{ width:`${fill}%`, background:`linear-gradient(90deg, ${friend.color}, #00ff87)`, boxShadow:`0 0 10px ${friend.color}99` }}/>
          </div>
          <div className="mt-2 flex gap-3 font-mono text-[11px]">
            <span className="text-cyan26">▼ {match.youReceive.length} p/ você</span>
            <span className="text-neon">▲ {match.youSend.length} p/ {friend.name}</span>
            <span className="text-dim ml-auto">{match.pairs} troca{match.pairs===1?'':'s'} sugerida{match.pairs===1?'':'s'}</span>
          </div>
        </div>
      </div>
    </button>
  );
}

  const [dir, setDir] = useState(1);
  const [openFriend, setOpenFriend] = useState(null);
  const prevIdx = useRef(0);

    window.scrollTo({ top: 0 });
  };

  const inc = useCallback((id) => setCounts(c => ({ ...c, [id]: (c[id] || 0) + 1 })), [setCounts]);
  const dec = useCallback((id) => setCounts(c => {
    const n = Math.max(0, (c[id] || 0) - 1);
    const next = { ...c };
    if (n === 0) delete next[id]; else next[id] = n;
    return next;
  }), [setCounts]);

  const dupeTotal = useMemo(() => STICKERS.reduce((a, s) => a + Math.max(0, (counts[s.id] || 0) - 1), 0), [counts]);
  const matchAlert = useMemo(() => FRIENDS.some(f => computeMatch(f, counts).pairs > 0), [counts]);

  return (
    <div className="min-h-screen bg-void pb-32">
      {/* ticker topo */}
      <div className="sticky top-0 z-30 glass-deep border-x-0 border-t-0 overflow-hidden">
        <div className="anim-ticker flex whitespace-nowrap py-1.5 font-mono text-[10px] tracking-[.25em] uppercase text-dim">
          {[0,1].map(k => (
            <span key={k} className="flex shrink-0">
              {['STICKR·26','USA · MEX · CAN','48 seleções','994 figurinhas','104 jogos','troque agora','11.06.2026'].map((t, i) => (
                <span key={i} className="mx-6 flex items-center gap-6">{t}<span className="text-cyan26">◆</span></span>
              ))}
            </span>
          ))}
        </div>
      </div>

      {tab === 'album' && <ParallaxHeader counts={counts} active={tab === 'album'}/>}

      {/* conteúdo com transição de slide */}
      <main key={tab} className={dir > 0 ? 'anim-slideL' : 'anim-slideR'}>
        {tab === 'album'   && <AlbumTab counts={counts} onInc={inc} onDec={dec}/>}
        {tab === 'copies'  && <CopiesTab counts={counts} onInc={inc} onDec={dec}/>}
        {tab === 'matches' && <MatchesTab counts={counts} onOpenFriend={setOpenFriend}/>}
      </main>

      <BottomNav tab={tab} setTab={setTab} dupeTotal={dupeTotal} matchAlert={matchAlert}/>

      {openFriend && <TradeModal friend={openFriend} counts={counts} onClose={() => setOpenFriend(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
