};
async function rpc(fn, args) {
  if (!sb) throw new Error('Sem conexão com o servidor.');
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    const key = Object.keys(ERR_MSG).find(k => (error.message || '').includes(k));
    throw new Error(key ? ERR_MSG[key] : 'Erro de conexão — tente de novo.');
  }
  return data;
}

/* match real entre membros do grupo (baseado nas coleções de verdade) */
function computeRealMatch(member, myCounts) {
  const theirs = member.counts || {};
  const youReceive = Object.keys(theirs).filter(id => theirs[id] >= 2 && (myCounts[id] || 0) === 0);
  const youSend = Object.keys(myCounts).filter(id => (myCounts[id] || 0) >= 2 && !(theirs[id] > 0));
  const pairs = Math.min(youReceive.length, youSend.length);
  const theirDupes = Object.values(theirs).filter(c => c >= 2).length;
  const myDupes = Object.values(myCounts).filter(c => c >= 2).length;
  const potential = theirDupes + myDupes;
  const pct = potential === 0 ? 0 : Math.min(100, Math.round(((youReceive.length + youSend.length) / potential) * 100));
  return { youReceive, youSend, pairs, pct };
}

================================================================ */
function usePersistedCounts() {
  const [counts, setCounts] = useState(() => {
    try {
      const raw = localStorage.getItem('stickr26-v2');
      return raw ? JSON.parse(raw) : INITIAL_COUNTS;
    } catch { return INITIAL_COUNTS; }
  });
  useEffect(() => {
    try { localStorage.setItem('stickr26-v2', JSON.stringify(counts)); } catch {}
  }, [counts]);
  return [counts, setCounts];
}

function useScrollY(active) {
  const [y, setY] = useState(0);
  useEffect(() => {
    if (!active) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setY(window.scrollY));
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, [active]);
  return y;
}

/* ================================================================
   FIGURINHA — moldura Panini + tilt 3D + estados + spring
================================================================ */
function StickerCard({ sticker, count, onInc, onDec, compact }) {
  const ref = useRef(null);
  const [popKey, setPopKey] = useState(0);
  const [badgeKey, setBadgeKey] = useState(0);
  const longPress = useRef({ timer: null, fired: false });

  const owned = count > 0;
  const dupes = Math.max(0, count - 1);
  const { team, rarity } = sticker;

  /* tilt de perspectiva */
  const handleMove = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(700px) rotateY(${px * 16}deg) rotateX(${-py * 16}deg) scale(1.04) translateZ(0)`;
  };
  const handleLeave = () => {
    const el = ref.current; if (el) el.style.transform = '';
  };

  /* clique = incrementa · long-press = decrementa */
  const startPress = () => {
    longPress.current.fired = false;
    longPress.current.timer = setTimeout(() => {
      longPress.current.fired = true;
      if (count > 0) { onDec(sticker.id); if (navigator.vibrate) navigator.vibrate(18); }
    }, 480);
  };
  const endPress = () => clearTimeout(longPress.current.timer);
  const handleClick = () => {
    if (longPress.current.fired) return;
    onInc(sticker.id);
    setPopKey(k => k + 1);
    if (count >= 1) setBadgeKey(k => k + 1);
    if (navigator.vibrate) navigator.vibrate(8);
  };

  const isLegend = rarity === 'legend';
  const isShiny = rarity === 'shiny';
  const frameClass = isLegend ? 'frame-legend' : isShiny ? 'frame-shiny' : 'frame-common';

  return (
    <div className={`relative ${compact ? '' : 'group-card'}`} style={{ perspective:'700px' }}>
      <button
        ref={ref}
        onMouseMove={!compact ? handleMove : undefined}
        onMouseLeave={!compact ? handleLeave : undefined}
        onPointerDown={startPress}
        onPointerUp={endPress}
        onPointerCancel={endPress}
        onContextMenu={(e) => e.preventDefault()}
        onClick={handleClick}
        key={popKey}
        className={`sticker-tilt anim-pop relative w-full aspect-[3/4] rounded-xl text-left no-select
          ${owned ? `${frameClass} p-[5px] shine overflow-hidden` : 'border-2 border-dashed border-white/[.12] bg-white/[.015] overflow-hidden'}`}
        style={{ transformOrigin:'center' }}
        aria-label={`${sticker.codeLabel} — ${team.name}`}
      >
        {owned ? (
          /* ============ FIGURINHA COLADA (estilo Panini) ============ */
          <div className="relative h-full w-full rounded-[7px] overflow-hidden flex flex-col"
               style={{ background:`linear-gradient(155deg, ${team.c1} -20%, ${team.c2} 75%)` }}>
            <div className="stripes absolute inset-0 pointer-events-none"/>
            <div className="absolute inset-0 pointer-events-none" style={{ background:'radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255,255,255,.22), transparent 60%)' }}/>

            {/* topo: número + raridade */}
            <div className="relative flex items-start justify-between px-2 pt-1.5">
              <span className="font-mono font-bold text-[10px] px-1.5 py-0.5 rounded bg-black/45 text-white/90">
                {sticker.codeLabel}
              </span>
              {isShiny && <span className="text-white drop-shadow"><Icon.spark width="13" height="13"/></span>}
              {isLegend && <span className="text-yellow-200 drop-shadow"><Icon.spark width="15" height="15"/></span>}
            </div>

            {/* centro: bandeira + número grande (sem nomes de jogadores) */}
            <div className="relative flex-1 flex flex-col items-center justify-center">
              <span className="text-[32px] sm:text-[30px] leading-none drop-shadow-[0_4px_10px_rgba(0,0,0,.45)]">{sticker.icon || team.flag}</span>
              <span className="font-display font-black text-[26px] sm:text-[22px] leading-none text-white mt-1.5 drop-shadow-[0_2px_8px_rgba(0,0,0,.7)]">
                {sticker.team.code === 'FWC' ? String(sticker.num - 1).padStart(2,'0') : String(sticker.num).padStart(2,'0')}
              </span>
              {isLegend && (
                <span className="mt-1 font-mono text-[8px] uppercase tracking-[.3em] text-yellow-100/90 bg-black/35 px-2 py-0.5 rounded-full">{sticker.special ? 'lendária' : 'craque'}</span>
              )}
              {isShiny && (
                <span className="mt-1 font-mono text-[8px] uppercase tracking-[.3em] text-white/90 bg-black/35 px-2 py-0.5 rounded-full">brilhante</span>
              )}
            </div>

            {/* base: faixa de nome (clássico Panini) */}
            <div className="relative px-1.5 pb-1.5">
              <div className="rounded-md bg-[#0d0f14]/90 backdrop-blur-sm px-2 py-1.5 text-center border border-white/[.07]">
                <div className={`font-display leading-tight truncate ${isLegend ? 'font-extrabold text-[13px] sm:text-[12px] bg-clip-text text-transparent' : 'font-semibold text-[12px] sm:text-[11px] text-white'}`}
                     style={isLegend ? { backgroundImage:'linear-gradient(90deg,#ffd166,#00ff87,#00e5ff)' } : {}}>
                  {isLegend ? `★ ${sticker.label || 'Craque'}` : (sticker.label || `Nº ${String(sticker.num).padStart(2,'0')}`)}
                </div>
                <div className="font-mono text-[8px] uppercase tracking-[.22em] text-dim mt-0.5 truncate">{sticker.sub || team.name}</div>
              </div>
            </div>
          </div>
        ) : (
          /* ============ SLOT VAZIO (página do álbum) ============ */
          <div className="relative h-full w-full flex flex-col items-center justify-center">
            <span className="absolute top-2 left-2.5 font-mono text-[10px] text-white/25">{sticker.codeLabel}</span>
            <span className="absolute font-display font-black text-[64px] text-white/[.04] no-select">{sticker.num}</span>
            <span className="text-white/[.13]">{sticker.special ? <Icon.spark width="40" height="40"/> : <Icon.player width="44" height="44"/>}</span>
            {sticker.label && <span className="mt-2 font-semibold text-[11px] text-white/30 text-center px-2 leading-tight">{sticker.label}</span>}
            <span className="mt-2 font-mono text-[8px] uppercase tracking-[.3em] text-white/20 border border-white/10 rounded-full px-2.5 py-1">faltando</span>
          </div>
        )}
      </button>

      {/* badge de repetidas */}
      {dupes > 0 && (
        <div key={badgeKey}
             className="anim-badge absolute -top-1.5 -right-1.5 z-10 min-w-[26px] h-[26px] px-1.5 rounded-full flex items-center justify-center font-mono font-bold text-[12px] text-black"

          +{dupes}
        </div>
      )}

      {/* botão de ajuste (–) */}
      {owned && (
        <button
          onClick={(e) => { e.stopPropagation(); onDec(sticker.id); }}
          className="absolute -bottom-1.5 -right-1.5 z-10 w-[24px] h-[24px] rounded-full glass-deep flex items-center justify-center text-white/60 hover:text-white hover:border-cyan26/50 active:scale-90 transition-all"
          aria-label="Remover uma unidade"
        >
          <Icon.minus width="12" height="12"/>
        </button>
      )}
    </div>
  );
}

    !query || norm(t.name).includes(query) || t.code.toLowerCase().includes(query);

      key={team.code}

  if (sort === 'az') {
    const teams = TEAMS
      .filter(t => (group === 'Todas' || t.group === group) && matchTeam(t))
      .slice()
      .sort((a, b) => a.code.localeCompare(b.code)); /* A–Z pela sigla FIFA (nome em inglês) */

/* ================================================================
   ALGORITMO DE MATCH
================================================================ */
function computeMatch(friend, counts) {
  const youReceive = friend.has.filter(id => (counts[id] || 0) === 0);          // ele tem ∧ eu preciso
  const youSend    = friend.needs.filter(id => (counts[id] || 0) >= 2);         // ele precisa ∧ tenho repetida
  const pairs = Math.min(youReceive.length, youSend.length);
  const pool = friend.has.length + friend.needs.length;
  const pct = pool === 0 ? 0 : Math.min(100, Math.round(((youReceive.length + youSend.length) / pool) * 100));
  return { youReceive, youSend, pairs, pct };
}

function MatchCard({ friend, match, onOpen, delay }) {
  const [fill, setFill] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setFill(match.pct), 180 + delay);

  }, [match.pct, delay]);

  return (
    <button
      onClick={() => onOpen(friend)}
      className="anim-fadeup w-full glass rounded-2xl p-4 text-left transition-all duration-300 hover:border-white/20 hover:-translate-y-0.5 active:scale-[.985]"
      style={{ animationDelay:`${delay}ms` }}
    >
      <div className="flex items-center gap-3.5">
        <div className="relative shrink-0 w-12 h-12 rounded-2xl flex items-center justify-center text-xl"
             style={{ background:`linear-gradient(140deg, ${friend.color}33, ${friend.color}0d)`, border:`1px solid ${friend.color}55` }}>
          {friend.emoji}
          {match.pairs > 0 && <span className="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-neon animate-pulse" style={{ boxShadow:'0 0 8px #00ff87' }}/>}
        </div>

        <div className="flex-1 min-w-0">
          <div className="flex items-baseline justify-between gap-2">
            <span className="font-display font-semibold text-[15px]">{friend.name}</span>
            <span className="font-mono font-bold text-base" style={{ color: friend.color }}>{match.pct}%</span>
          </div>
          <div className="mt-1.5 h-1.5 rounded-full bg-white/[.07] overflow-hidden">
            <div className="bar-fill h-full rounded-full"
                 style={{ width:`${fill}%`, background:`linear-gradient(90deg, ${friend.color}, #00ff87)`, boxShadow:`0 0 10px ${friend.color}99` }}/>
          </div>
          <div className="mt-2 flex gap-3 font-mono text-[11px]">

          </div>

      </div>
    </button>
  );
}

const EMOJIS = ['⚽','🧢','⚡','🌟','🔥','🦁','👑','🎯'];

function Field({ label, children }) {
  return (
    <label className="block">
      <span className="font-mono text-[10px] uppercase tracking-[.25em] text-dim">{label}</span>
      <div className="mt-1.5">{children}</div>

function GroupTab({ session, onAuth, onLogout, invite, onClearInvite, activeGroupId, setActiveGroupId, groupData, onRefresh }) {
  const [mode, setMode] = useState('signup'); // 'signup' | 'login'
  const [name, setName] = useState('');
  const [pin, setPin] = useState('');
  const [emoji, setEmoji] = useState('⚽');
  const [joinCode, setJoinCode] = useState('');
  const [newGroup, setNewGroup] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);   // { ok: bool, text }
  const [copied, setCopied] = useState(null);

  const flash = (ok, text) => { setMsg({ ok, text }); setTimeout(() => setMsg(null), 4000); };

  const submit = async () => {
    if (!name.trim() || !pin) return flash(false, 'Preencha nome e PIN.');
    setBusy(true);
    try {
      let payload = mode === 'signup'
        ? await rpc('stickr_signup', { p_name: name, p_pin: pin, p_emoji: emoji })
        : await rpc('stickr_login', { p_name: name, p_pin: pin });
      if (invite) {
        try {
          payload = await rpc('stickr_join_group', { p_user: payload.user_id, p_token: payload.token, p_code: invite });
          onClearInvite();
        } catch (e) { flash(false, e.message); }
      }
      onAuth(payload);
      flash(true, mode === 'signup' ? 'Conta criada! Seu grupo já tem um código de convite.' : 'Bem-vindo de volta!');
    } catch (e) { flash(false, e.message); }
    setBusy(false);
  };

  const join = async () => {
    if (!joinCode.trim()) return;
    setBusy(true);
    try {
      const payload = await rpc('stickr_join_group', { p_user: session.user_id, p_token: session.token, p_code: joinCode });
      onAuth(payload);
      setJoinCode('');
      flash(true, 'Você entrou no grupo!');
    } catch (e) { flash(false, e.message); }
    setBusy(false);
  };

  const createGroup = async () => {
    if (!newGroup.trim()) return;
    setBusy(true);
    try {
      const payload = await rpc('stickr_create_group', { p_user: session.user_id, p_token: session.token, p_name: newGroup });
      onAuth(payload);
      setNewGroup('');
      flash(true, 'Grupo criado!');
    } catch (e) { flash(false, e.message); }
    setBusy(false);
  };

  const inviteLink = (code) => `${location.origin}${location.pathname}?convite=${code}`;
  const copyLink = async (code) => {
    try {
      await navigator.clipboard.writeText(inviteLink(code));
      setCopied(code); setTimeout(() => setCopied(null), 2000);
    } catch { flash(false, 'Não consegui copiar — código: ' + code); }
  };
  const shareLink = (g) => {
    const url = inviteLink(g.code);
    if (navigator.share) {
      navigator.share({ title: 'STICKR·26', text: `Entre no meu grupo de troca de figurinhas da Copa 2026! Código: ${g.code}`, url }).catch(() => {});
    } else copyLink(g.code);
  };

  const inputCls = 'w-full glass rounded-xl px-4 py-3 bg-transparent outline-none text-[14px] placeholder:text-dim/50 focus:border-cyan26/50 transition-colors';

  /* -------- deslogado: criar conta / entrar -------- */
  if (!session) {
    return (
      <div className="px-4 pb-10 pt-6 max-w-md mx-auto">
        <div className="anim-fadeup mb-6">
          <h2 className="font-display font-extrabold text-2xl">Seu <span className="text-cyan26">Grupo</span> de Troca</h2>
          <p className="text-dim text-[13px] mt-1">Crie sua conta, convide amigos e troquem figurinhas de verdade.</p>
        </div>

        {invite && (
          <div className="anim-fadeup mb-4 rounded-2xl px-4 py-3 border border-neon/40 bg-neon/[.07]">
            <span className="text-[13px]">🎟️ <b className="text-neon">Você foi convidado!</b> Crie sua conta (ou entre) para se juntar ao grupo <b className="font-mono">{invite}</b>.</span>
          </div>
        )}

        <div className="anim-fadeup glass rounded-2xl p-1 flex mb-4" style={{ animationDelay:'80ms' }}>
          {[['signup','Criar conta'],['login','Já tenho conta']].map(([key, label]) => (
            <button key={key} onClick={() => setMode(key)}
                    className={`flex-1 font-display font-semibold text-[12px] py-2.5 rounded-xl transition-all duration-300

            </button>
          ))}
        </div>

        <div className="anim-fadeup glass rounded-2xl p-5 flex flex-col gap-4" style={{ animationDelay:'140ms' }}>
          <Field label="Seu nome ou apelido">
            <input className={inputCls} value={name} onChange={e => setName(e.target.value)} maxLength={20} placeholder="Ex.: Cunha"/>
          </Field>
          <Field label="PIN (4 a 8 números — sua senha)">
            <input className={inputCls} value={pin} onChange={e => setPin(e.target.value.replace(/\D/g,'').slice(0,8))}
                   type="password" inputMode="numeric" placeholder="••••"/>
          </Field>
          {mode === 'signup' && (
            <Field label="Seu emoji">
              <div className="flex gap-1.5 flex-wrap">
                {EMOJIS.map(e => (
                  <button key={e} onClick={() => setEmoji(e)}
                          className={`w-10 h-10 rounded-xl text-lg flex items-center justify-center border transition-all active:scale-90
                            ${emoji === e ? 'border-cyan26/60 bg-cyan26/10' : 'border-white/10 hover:border-white/25'}`}>
                    {e}
                  </button>
                ))}
              </div>
            </Field>
          )}
          <button onClick={submit} disabled={busy}
                  className="w-full rounded-2xl py-3.5 font-display font-semibold text-[13px] tracking-wide text-black active:scale-[.98] transition-all disabled:opacity-50"
                  style={{ background:'linear-gradient(95deg,#00e5ff,#00ff87)', boxShadow:'0 8px 28px -8px rgba(0,255,135,.55)' }}>
            {busy ? 'AGUARDE…' : mode === 'signup' ? 'CRIAR CONTA E MEU GRUPO' : 'ENTRAR'}
          </button>
          {msg && <p className={`text-[12px] text-center ${msg.ok ? 'text-neon' : 'text-red-400'}`}>{msg.text}</p>}
        </div>

        <p className="anim-fadeup text-center text-[11px] text-dim mt-4" style={{ animationDelay:'200ms' }}>
          Ao criar a conta, um grupo seu já nasce com código de convite para chamar os amigos.
        </p>
      </div>
    );
  }

  /* -------- logado: grupos, convites, membros -------- */
  const groups = session.groups || [];
  const active = groups.find(g => g.id === activeGroupId) || groups[0];

  return (
    <div className="px-4 pb-10 pt-6 max-w-md mx-auto">
      {/* perfil */}
      <div className="anim-fadeup glass rounded-2xl p-4 flex items-center gap-3.5 mb-5">
        <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl border border-cyan26/40 bg-cyan26/10">{session.emoji}</div>
        <div className="flex-1 min-w-0">
          <div className="font-display font-extrabold text-[16px] truncate">{session.name}</div>
          <div className="font-mono text-[11px] text-dim">{groups.length} grupo{groups.length===1?'':'s'} de troca</div>
        </div>
        <button onClick={onLogout} className="font-mono text-[11px] uppercase tracking-wider text-dim hover:text-red-400 transition-colors">sair</button>
      </div>

      {msg && <p className={`anim-fadeup text-[12px] text-center mb-3 ${msg.ok ? 'text-neon' : 'text-red-400'}`}>{msg.text}</p>}

      {/* grupos */}
      <div className="flex flex-col gap-3 mb-5">
        {groups.map((g, gi) => {
          const isActive = active && g.id === active.id;
          return (
            <div key={g.id} className={`anim-fadeup glass rounded-2xl p-4 transition-all ${isActive ? 'border-cyan26/40' : ''}`} style={{ animationDelay:`${gi*70}ms` }}>
              <button onClick={() => setActiveGroupId(g.id)} className="w-full flex items-center gap-3 text-left">
                <span className={`w-2.5 h-2.5 rounded-full shrink-0 ${isActive ? 'bg-neon' : 'bg-white/15'}`} style={isActive ? { boxShadow:'0 0 8px #00ff87' } : {}}/>
                <span className="font-display font-semibold text-[14px] flex-1 truncate">{g.name}</span>
                <span className="font-mono text-[11px] text-dim shrink-0">{g.members} membro{g.members===1?'':'s'}</span>
              </button>
              {isActive && (
                <div className="mt-3 pt-3 border-t border-white/[.07]">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-[10px] uppercase tracking-[.25em] text-dim">Convite</span>
                    <span className="font-mono font-bold text-[16px] text-cyan26 tracking-[.2em]">{g.code}</span>
                    <div className="ml-auto flex gap-1.5">
                      <button onClick={() => copyLink(g.code)}
                              className="glass rounded-lg px-2.5 py-1.5 text-[11px] font-mono flex items-center gap-1.5 text-white/80 hover:border-cyan26/40 active:scale-95 transition-all">
                        <Icon.copy width="12" height="12"/>{copied === g.code ? 'copiado!' : 'link'}
                      </button>
                      <button onClick={() => shareLink(g)}
                              className="rounded-lg px-2.5 py-1.5 text-[11px] font-mono flex items-center gap-1.5 text-black active:scale-95 transition-all"
                              style={{ background:'linear-gradient(95deg,#00e5ff,#00ff87)' }}>
                        <Icon.share width="12" height="12"/>convidar
                      </button>
                    </div>
                  </div>

                  {/* membros do grupo ativo */}
                  <div className="mt-3 flex flex-col gap-2">
                    {(groupData?.group?.id === g.id ? groupData.members : []).map((m, mi) => {
                      const owned = Object.values(m.counts || {}).filter(c => c > 0).length;
                      const mpct = Math.round((owned / STICKERS.length) * 100);
                      return (
                        <div key={m.id} className="flex items-center gap-2.5 rounded-xl px-3 py-2 bg-white/[.04] border border-white/[.06]">
                          <span className="text-lg">{m.emoji}</span>
                          <span className="text-[13px] font-semibold flex-1 truncate">{m.name}</span>
                          <span className="font-mono text-[11px]" style={{ color: MEMBER_COLORS[mi % MEMBER_COLORS.length] }}>{mpct}% do álbum</span>
                        </div>
                      );
                    })}
                    {groupData?.group?.id === g.id && groupData.members.length === 0 && (
                      <p className="text-[12px] text-dim italic">Só você por aqui — mande o link de convite! 🎟️</p>
                    )}
                    <button onClick={onRefresh} className="font-mono text-[10px] uppercase tracking-wider text-dim hover:text-cyan26 self-start transition-colors">↻ atualizar membros</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* entrar em grupo por código */}
      <div className="anim-fadeup glass rounded-2xl p-4 mb-3" style={{ animationDelay:'200ms' }}>
        <Field label="Entrar num grupo com código">
          <div className="flex gap-2">
            <input className={inputCls + ' uppercase'} value={joinCode} onChange={e => setJoinCode(e.target.value.toUpperCase().slice(0,6))} placeholder="ABC123" maxLength={6}/>
            <button onClick={join} disabled={busy || joinCode.length < 6}
                    className="shrink-0 rounded-xl px-4 font-display font-semibold text-[12px] text-black disabled:opacity-40 active:scale-95 transition-all"
                    style={{ background:'linear-gradient(95deg,#00e5ff,#00ff87)' }}>
              ENTRAR
            </button>
          </div>
        </Field>
      </div>

      {/* criar novo grupo */}
      <div className="anim-fadeup glass rounded-2xl p-4" style={{ animationDelay:'260ms' }}>
        <Field label="Criar outro grupo">
          <div className="flex gap-2">
            <input className={inputCls} value={newGroup} onChange={e => setNewGroup(e.target.value)} placeholder="Ex.: Galera da escola" maxLength={40}/>
            <button onClick={createGroup} disabled={busy || newGroup.trim().length < 2}
                    className="shrink-0 glass rounded-xl px-4 font-display font-semibold text-[12px] text-cyan26 hover:border-cyan26/40 disabled:opacity-40 active:scale-95 transition-all">
              CRIAR
            </button>
          </div>
        </Field>
      </div>
    </div>
  );
}

/* ================================================================
   NAVEGAÇÃO INFERIOR
================================================================ */
const TABS = [
  { id:'album',   label:'Álbum',     icon: Icon.album },
  { id:'copies',  label:'Repetidas', icon: Icon.copies },
  { id:'matches', label:'Matches',   icon: Icon.swap },
  { id:'group',   label:'Grupo',     icon: Icon.users },
];

function BottomNav({ tab, setTab, dupeTotal, matchAlert, groupAlert }) {
  const idx = TABS.findIndex(t => t.id === tab);
  const n = TABS.length;
  return (
    <nav className="fixed bottom-0 inset-x-0 z-40 pb-[env(safe-area-inset-bottom)]">
      <div className="max-w-md mx-auto px-4 pb-3">
        <div className="glass-deep rounded-3xl p-1.5 relative">
          {/* pílula ativa deslizante */}
          <div className="absolute top-1.5 bottom-1.5 rounded-2xl transition-all duration-300"
               style={{ left:`calc(${idx} * (100% - 12px) / ${n} + 6px)`, width:`calc((100% - 12px) / ${n})`,
                        background:'linear-gradient(140deg, rgba(0,229,255,.16), rgba(0,255,135,.08))',
                        border:'1px solid rgba(0,229,255,.3)', boxShadow:'0 0 20px -4px rgba(0,229,255,.3)',
                        transitionTimingFunction:'cubic-bezier(.3,1.4,.4,1)' }}/>
          <div className="relative grid grid-cols-4">
            {TABS.map(t => {
              const active = tab === t.id;
              const I = t.icon;
              return (
                <button key={t.id} onClick={() => setTab(t.id)}
                        className={`relative flex flex-col items-center gap-1 py-2.5 rounded-2xl transition-colors duration-300 ${active ? 'text-cyan26' : 'text-dim hover:text-white/80'}`}>
                  <span className="relative">
                    <I width="20" height="20"/>
                    {t.id === 'copies' && dupeTotal > 0 && (
                      <span className="absolute -top-1.5 -right-2.5 min-w-[16px] h-[16px] px-1 rounded-full bg-neon text-black font-mono font-bold text-[9px] flex items-center justify-center">{dupeTotal}</span>
                    )}
                    {t.id === 'matches' && matchAlert && (
                      <span className="absolute -top-0.5 -right-1 w-2 h-2 rounded-full bg-neon animate-pulse" style={{ boxShadow:'0 0 6px #00ff87' }}/>
                    )}
                    {t.id === 'group' && groupAlert && (
                      <span className="absolute -top-0.5 -right-1 w-2 h-2 rounded-full bg-neon animate-pulse" style={{ boxShadow:'0 0 6px #00ff87' }}/>
                    )}
                  </span>
                  <span className={`text-[10px] tracking-wide ${active ? 'font-semibold' : ''}`}>{t.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </nav>
  );
}

/* ================================================================
   APP
================================================================ */
function App() {
  const [counts, setCounts] = usePersistedCounts();
  const [tab, setTabRaw] = useState('album');
  const [dir, setDir] = useState(1);
  const [openMatch, setOpenMatch] = useState(null); // { kind, person, member?|friend? }
  const prevIdx = useRef(0);

  /* ---- sessão (conta) ---- */
  const [session, setSession] = useState(() => {
    try { return JSON.parse(localStorage.getItem('stickr26-session')); } catch { return null; }
  });
  const [activeGroupId, setActiveGroupId] = useState(() => localStorage.getItem('stickr26-group') || null);
  const [groupData, setGroupData] = useState(null);
  const [loadingGroup, setLoadingGroup] = useState(false);
  const [invite, setInvite] = useState(() => {
    const c = new URLSearchParams(location.search).get('convite');
    return c ? c.toUpperCase().slice(0, 6) : null;
  });
  const clearInvite = () => {
    setInvite(null);
    history.replaceState(null, '', location.pathname);
  };

  useEffect(() => {
    try {
      if (session) localStorage.setItem('stickr26-session', JSON.stringify(session));
      else localStorage.removeItem('stickr26-session');
    } catch {}
  }, [session]);
  useEffect(() => {
    try { activeGroupId ? localStorage.setItem('stickr26-group', activeGroupId) : localStorage.removeItem('stickr26-group'); } catch {}
  }, [activeGroupId]);

  /* login/cadastro: puxa coleção do servidor (ou sobe a local na 1ª vez) */
  const handleAuth = useCallback(async (payload) => {
    setSession(payload);
    if (!payload.groups?.some(g => g.id === activeGroupId)) {
      setActiveGroupId(payload.groups?.[0]?.id || null);
    }
    try {
      const server = await rpc('stickr_get_collection', { p_user: payload.user_id, p_token: payload.token });
      const serverHas = server && Object.keys(server).length > 0;
      if (serverHas) setCounts(server);
      else await rpc('stickr_save_collection', { p_user: payload.user_id, p_token: payload.token, p_counts: counts });
    } catch {}
  }, [counts, activeGroupId, setCounts]);

  const handleLogout = () => { setSession(null); setGroupData(null); };

  /* sincroniza a coleção no servidor (debounce) */
  const syncTimer = useRef(null);
  useEffect(() => {
    if (!session) return;
    clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(() => {
      rpc('stickr_save_collection', { p_user: session.user_id, p_token: session.token, p_counts: counts }).catch(() => {});
    }, 1200);
    return () => clearTimeout(syncTimer.current);
  }, [counts, session]);

  /* dados do grupo ativo (membros + coleções) */
  const refreshGroup = useCallback(async () => {
    if (!session) return;
    const gid = activeGroupId || session.groups?.[0]?.id;
    if (!gid) return;
    setLoadingGroup(true);
    try {
      const data = await rpc('stickr_group_data', { p_user: session.user_id, p_token: session.token, p_group: gid });
      setGroupData(data);
    } catch {}
    setLoadingGroup(false);
  }, [session, activeGroupId]);

  useEffect(() => {
    if (session && (tab === 'matches' || tab === 'group')) refreshGroup();
  }, [tab, session, activeGroupId, refreshGroup]);

  /* convite na URL com sessão ativa → entra direto */
  useEffect(() => {
    if (invite && session) {
      rpc('stickr_join_group', { p_user: session.user_id, p_token: session.token, p_code: invite })
        .then(payload => { setSession(payload); clearInvite(); setTabRaw('group'); })
        .catch(() => clearInvite());
    }
  }, [invite, session]);

  const setTab = (next) => {
    const ni = TABS.findIndex(t => t.id === next);
    setDir(ni >= prevIdx.current ? 1 : -1);
    prevIdx.current = ni;
    setTabRaw(next);
    window.scrollTo({ top: 0 });
  };

  const inc = useCallback((id) => setCounts(c => ({ ...c, [id]: (c[id] || 0) + 1 })), [setCounts]);
  const dec = useCallback((id) => setCounts(c => {
    const n = Math.max(0, (c[id] || 0) - 1);
    const next = { ...c };
    if (n === 0) delete next[id]; else next[id] = n;
    return next;
  }), [setCounts]);

  const dupeTotal = useMemo(() => STICKERS.reduce((a, s) => a + Math.max(0, (counts[s.id] || 0) - 1), 0), [counts]);
  const matchAlert = useMemo(() => {
    if (session && groupData?.members?.length) return groupData.members.some(m => computeRealMatch(m, counts).pairs > 0);
    return FRIENDS.some(f => computeMatch(f, counts).pairs > 0);
  }, [counts, session, groupData]);

  /* modal de troca: recalcula ao vivo conforme a coleção muda */
  let modal = null;
  if (openMatch) {
    const person = openMatch.person;
    const match = openMatch.kind === 'real'
      ? computeRealMatch(openMatch.member, counts)
      : computeMatch(openMatch.friend, counts);
    modal = <TradeModal person={person} match={match} onClose={() => setOpenMatch(null)}/>;
  }

  return (
    <div className="min-h-screen bg-void pb-32">
      {/* ticker topo */}
      <div className="sticky top-0 z-30 glass-deep border-x-0 border-t-0 overflow-hidden">
        <div className="anim-ticker flex whitespace-nowrap py-1.5 font-mono text-[10px] tracking-[.25em] uppercase text-dim">
          {[0,1].map(k => (
            <span key={k} className="flex shrink-0">
              {['STICKR·26','USA · MEX · CAN','48 seleções','994 figurinhas','104 jogos','troque agora','11.06.2026'].map((t, i) => (
                <span key={i} className="mx-6 flex items-center gap-6">{t}<span className="text-cyan26">◆</span></span>
              ))}
            </span>
          ))}
        </div>
      </div>

      {tab === 'album' && <ParallaxHeader counts={counts} active={tab === 'album'}/>}

      {/* conteúdo com transição de slide */}
      <main key={tab} className={dir > 0 ? 'anim-slideL' : 'anim-slideR'}>
        {tab === 'album'   && <AlbumTab counts={counts} onInc={inc} onDec={dec}/>}
        {tab === 'copies'  && <CopiesTab counts={counts} onInc={inc} onDec={dec}/>}
        {tab === 'matches' && (
          <MatchesTab counts={counts} onOpen={setOpenMatch} session={session} groupData={groupData}
                      onGoGroup={() => setTab('group')} onRefresh={refreshGroup} loading={loadingGroup}/>
        )}
        {tab === 'group' && (
          <GroupTab session={session} onAuth={handleAuth} onLogout={handleLogout}
                    invite={invite} onClearInvite={clearInvite}
                    activeGroupId={activeGroupId} setActiveGroupId={setActiveGroupId}
                    groupData={groupData} onRefresh={refreshGroup}/>
        )}
      </main>

      <BottomNav tab={tab} setTab={setTab} dupeTotal={dupeTotal} matchAlert={matchAlert} groupAlert={!!invite && !session}/>

      {modal}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
