function usePersistedCounts() {
  const [counts, setCounts] = useState(() => {
    try {
      const raw = localStorage.getItem('stickr26');
      return raw ? JSON.parse(raw) : INITIAL_COUNTS;
    } catch { return INITIAL_COUNTS; }
  });
  useEffect(() => {
    try { localStorage.setItem('stickr26', JSON.stringify(counts)); } catch {}
  }, [counts]);
  return [counts, setCounts];
}

function useScrollY(active) {
  const [y, setY] = useState(0);
  useEffect(() => {
    if (!active) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setY(window.scrollY));
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, [active]);
  return y;
}

/* ================================================================
   FIGURINHA — moldura Panini + tilt 3D + estados + spring
================================================================ */
function StickerCard({ sticker, count, onInc, onDec, compact }) {
  const ref = useRef(null);
  const [popKey, setPopKey] = useState(0);
  const [badgeKey, setBadgeKey] = useState(0);
  const longPress = useRef({ timer: null, fired: false });

  const owned = count > 0;
  const dupes = Math.max(0, count - 1);
  const { team, rarity } = sticker;

  /* tilt de perspectiva */
  const handleMove = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(700px) rotateY(${px * 16}deg) rotateX(${-py * 16}deg) scale(1.04) translateZ(0)`;
  };
  const handleLeave = () => {
    const el = ref.current; if (el) el.style.transform = '';
  };

  /* clique = incrementa · long-press = decrementa */
  const startPress = () => {
    longPress.current.fired = false;
    longPress.current.timer = setTimeout(() => {
      longPress.current.fired = true;
      if (count > 0) { onDec(sticker.id); if (navigator.vibrate) navigator.vibrate(18); }
    }, 480);
  };
  const endPress = () => clearTimeout(longPress.current.timer);
  const handleClick = () => {
    if (longPress.current.fired) return;
    onInc(sticker.id);
    setPopKey(k => k + 1);
    if (count >= 1) setBadgeKey(k => k + 1);
    if (navigator.vibrate) navigator.vibrate(8);
  };

  const isLegend = rarity === 'legend';
  const isShiny = rarity === 'shiny';
  const frameClass = isLegend ? 'frame-legend' : isShiny ? 'frame-shiny' : 'frame-common';

  return (
    <div className={`relative ${compact ? '' : 'group-card'}`} style={{ perspective:'700px' }}>
      <button
        ref={ref}
        onMouseMove={!compact ? handleMove : undefined}
        onMouseLeave={!compact ? handleLeave : undefined}
        onPointerDown={startPress}
        onPointerUp={endPress}
        onPointerCancel={endPress}
        onContextMenu={(e) => e.preventDefault()}
        onClick={handleClick}
        key={popKey}
        className={`sticker-tilt anim-pop relative w-full aspect-[3/4] rounded-xl text-left no-select
          ${owned ? `${frameClass} p-[5px] shine overflow-hidden` : 'border-2 border-dashed border-white/[.12] bg-white/[.015] overflow-hidden'}`}
        style={{ transformOrigin:'center' }}
        aria-label={`${sticker.label} — ${team.name}`}
      >
        {owned ? (
          /* ============ FIGURINHA COLADA (estilo Panini) ============ */
          <div className="relative h-full w-full rounded-[7px] overflow-hidden flex flex-col"
               style={{ background:`linear-gradient(155deg, ${team.c1} -20%, ${team.c2} 75%)` }}>
            <div className="stripes absolute inset-0 pointer-events-none"/>
            <div className="absolute inset-0 pointer-events-none" style={{ background:'radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255,255,255,.22), transparent 60%)' }}/>

            {/* topo: número + raridade */}
            <div className="relative flex items-start justify-between px-2 pt-1.5">
              <span className="font-mono font-bold text-[10px] px-1.5 py-0.5 rounded bg-black/45 text-white/90">
                {team.code}·{String(sticker.num).padStart(2,'0')}
              </span>
              {isShiny && <span className="text-white drop-shadow"><Icon.spark width="13" height="13"/></span>}
              {isLegend && <span className="text-yellow-200 drop-shadow"><Icon.spark width="15" height="15"/></span>}
            </div>

            {/* centro: bandeira */}
            <div className="relative flex-1 flex flex-col items-center justify-center">
              <span className="text-[42px] sm:text-[38px] leading-none drop-shadow-[0_4px_10px_rgba(0,0,0,.45)]">{team.flag}</span>
              {isLegend && (
                <span className="mt-1 font-mono text-[8px] uppercase tracking-[.3em] text-yellow-100/90 bg-black/35 px-2 py-0.5 rounded-full">craque</span>
              )}
              {isShiny && (
                <span className="mt-1 font-mono text-[8px] uppercase tracking-[.3em] text-white/90 bg-black/35 px-2 py-0.5 rounded-full">brilhante</span>
              )}
            </div>

            {/* base: faixa de nome (clássico Panini) */}
            <div className="relative px-1.5 pb-1.5">
              <div className="rounded-md bg-[#0d0f14]/90 backdrop-blur-sm px-2 py-1.5 text-center border border-white/[.07]">
                <div className={`font-display leading-tight truncate ${isLegend ? 'font-extrabold text-[13px] sm:text-[12px] bg-clip-text text-transparent' : 'font-semibold text-[12px] sm:text-[11px] text-white'}`}
                     style={isLegend ? { backgroundImage:'linear-gradient(90deg,#ffd166,#00ff87,#00e5ff)' } : {}}>
                  {isLegend ? `★ ${sticker.label}` : sticker.label}
                </div>
                <div className="font-mono text-[8px] uppercase tracking-[.22em] text-dim mt-0.5 truncate">{team.name}</div>
              </div>
            </div>
          </div>
        ) : (
          /* ============ SLOT VAZIO (página do álbum) ============ */
          <div className="relative h-full w-full flex flex-col items-center justify-center">
            <span className="absolute top-2 left-2.5 font-mono text-[10px] text-white/25">{team.code}·{String(sticker.num).padStart(2,'0')}</span>
            <span className="absolute font-display font-black text-[64px] text-white/[.04] no-select">{sticker.num}</span>
            <span className="text-white/[.13]"><Icon.player width="44" height="44"/></span>
            <span className="mt-2 font-semibold text-[11px] text-white/30 text-center px-2 leading-tight">{sticker.label}</span>
            <span className="mt-2 font-mono text-[8px] uppercase tracking-[.3em] text-white/20 border border-white/10 rounded-full px-2.5 py-1">faltando</span>
          </div>
        )}
      </button>

      {/* badge de repetidas */}
      {dupes > 0 && (
        <div key={badgeKey}
             className="anim-badge absolute -top-1.5 -right-1.5 z-10 min-w-[26px] h-[26px] px-1.5 rounded-full flex items-center justify-center font-mono font-bold text-[12px] text-black"
             style={{ background:'linear-gradient(135deg,#00ff87,#00e5ff)', boxShadow:'0 0 14px rgba(0,255,135,.8), 0 2px 8px rgba(0,0,0,.6)' }}>
          +{dupes}
        </div>
      )}

      {/* botão de ajuste (–) */}
      {owned && (
        <button
          onClick={(e) => { e.stopPropagation(); onDec(sticker.id); }}
          className="absolute -bottom-1.5 -right-1.5 z-10 w-[24px] h-[24px] rounded-full glass-deep flex items-center justify-center text-white/60 hover:text-white hover:border-cyan26/50 active:scale-90 transition-all"
          aria-label="Remover uma unidade"
        >
          <Icon.minus width="12" height="12"/>
        </button>
      )}
    </div>
  );
}

/* ================================================================
   ALGORITMO DE MATCH
================================================================ */
function computeMatch(friend, counts) {
  const youReceive = friend.has.filter(id => (counts[id] || 0) === 0);          // ele tem ∧ eu preciso
  const youSend    = friend.needs.filter(id => (counts[id] || 0) >= 2);         // ele precisa ∧ tenho repetida
  const pairs = Math.min(youReceive.length, youSend.length);
  const pool = friend.has.length + friend.needs.length;
  const pct = pool === 0 ? 0 : Math.min(100, Math.round(((youReceive.length + youSend.length) / pool) * 100));
  return { youReceive, youSend, pairs, pct };
}

          <div className="flex items-baseline justify-between gap-2">
            <span className="font-display font-semibold text-[15px]">{friend.name}</span>
            <span className="font-mono font-bold text-base" style={{ color: friend.color }}>{match.pct}%</span>
          </div>
          <div className="mt-1.5 h-1.5 rounded-full bg-white/[.07] overflow-hidden">
            <div className="bar-fill h-full rounded-full"
                 style={{ width:`${fill}%`, background:`linear-gradient(90deg, ${friend.color}, #00ff87)`, boxShadow:`0 0 10px ${friend.color}99` }}/>
          </div>
          <div className="mt-2 flex gap-3 font-mono text-[11px]">
            <span className="text-cyan26">▼ {match.youReceive.length} p/ você</span>
            <span className="text-neon">▲ {match.youSend.length} p/ {friend.name}</span>
            <span className="text-dim ml-auto">{match.pairs} troca{match.pairs===1?'':'s'} sugerida{match.pairs===1?'':'s'}</span>
          </div>
        </div>
      </div>
    </button>
  );
}

function MatchesTab({ counts, onOpenFriend }) {
  const matches = useMemo(() =>
    FRIENDS
      .map(f => ({ friend: f, match: computeMatch(f, counts) }))
      .sort((a, b) => b.match.pct - a.match.pct),
  [counts]);

  return (
    <div className="px-4 pb-10 pt-6 max-w-2xl mx-auto">
      <div className="anim-fadeup mb-6">
        <h2 className="font-display font-extrabold text-2xl">Matches <span className="text-cyan26">ao vivo</span></h2>
        <p className="text-dim text-[13px] mt-1">Calculado em tempo real com base no seu álbum e nas suas repetidas.</p>
      </div>
      <div className="flex flex-col gap-3">
        {matches.map(({ friend, match }, i) => (
          <MatchCard key={friend.id} friend={friend} match={match} onOpen={onOpenFriend} delay={i * 90}/>
        ))}
      </div>

      <div className="anim-fadeup glass rounded-xl px-4 py-3 mt-6 text-[11px] text-dim flex gap-2 items-center" style={{ animationDelay:'320ms' }}>
        <span className="text-cyan26"><Icon.spark width="13" height="13"/></span>
        Cole ou marque repetidas no álbum e veja as porcentagens mudarem na hora.
      </div>
    </div>
  );
}

/* ================================================================
   MODAL DE TROCA
================================================================ */
function MiniSticker({ id }) {
  const s = STICKER_MAP[id];
  if (!s) return null;
  return (
    <div className="flex items-center gap-2.5 rounded-xl px-3 py-2 bg-white/[.04] border border-white/[.07]">
      <span className="text-lg shrink-0">{s.team.flag}</span>
      <div className="min-w-0">
        <div className="text-[12px] font-semibold truncate">{s.rarity==='legend' ? '★ ' : ''}{s.label}</div>
        <div className="font-mono text-[10px] text-dim">{s.team.code}·{String(s.num).padStart(2,'0')} — {s.team.name}</div>
      </div>
      {s.rarity !== 'common' && <span className={`ml-auto shrink-0 ${s.rarity==='legend'?'text-neon':'text-cyan26'}`}><Icon.spark width="12" height="12"/></span>}
    </div>
  );
}

function TradeModal({ friend, counts, onClose }) {
  const match = useMemo(() => computeMatch(friend, counts), [friend, counts]);
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [onClose]);

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
      <div className="anim-backdrop absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose}/>

      <div className="anim-modal relative w-full sm:max-w-md max-h-[86vh] overflow-y-auto glass-deep rounded-t-3xl sm:rounded-3xl p-5 pb-8">
        {/* header */}
        <div className="flex items-center gap-3.5 mb-5">
          <div className="w-[52px] h-[52px] rounded-2xl flex items-center justify-center text-2xl"
               style={{ background:`linear-gradient(140deg, ${friend.color}33, ${friend.color}0d)`, border:`1px solid ${friend.color}66` }}>
            {friend.emoji}
          </div>
          <div className="flex-1">
            <div className="font-display font-extrabold text-lg leading-tight">Match com {friend.name}</div>
            <div className="font-mono text-[12px]" style={{ color: friend.color }}>{match.pct}% de compatibilidade · {match.pairs} troca{match.pairs===1?'':'s'} sugerida{match.pairs===1?'':'s'}</div>
          </div>
          <button onClick={onClose} className="w-9 h-9 rounded-full glass flex items-center justify-center text-white/60 hover:text-white active:scale-90 transition-all">
            <Icon.close width="15" height="15"/>
          </button>
        </div>

        {/* você recebe */}
        <div className="mb-5">
          <div className="flex items-center gap-2 mb-2.5">
            <span className="font-mono text-[11px] uppercase tracking-[.25em] text-cyan26">▼ Você recebe</span>
            <span className="font-mono text-[11px] text-dim">({match.youReceive.length})</span>
            <span className="flex-1 h-px bg-gradient-to-r from-cyan26/40 to-transparent"/>
          </div>
          {match.youReceive.length > 0 ? (
            <div className="flex flex-col gap-1.5">{match.youReceive.map(id => <MiniSticker key={id} id={id}/>)}</div>
          ) : (
            <p className="text-[12px] text-dim italic px-1">{friend.name} não tem nada que falte no seu álbum agora.</p>
          )}
        </div>

        {/* você envia */}
        <div className="mb-6">
          <div className="flex items-center gap-2 mb-2.5">
            <span className="font-mono text-[11px] uppercase tracking-[.25em] text-neon">▲ Você envia</span>
            <span className="font-mono text-[11px] text-dim">({match.youSend.length})</span>
            <span className="flex-1 h-px bg-gradient-to-r from-neon/40 to-transparent"/>
          </div>
          {match.youSend.length > 0 ? (
            <div className="flex flex-col gap-1.5">{match.youSend.map(id => <MiniSticker key={id} id={id}/>)}</div>
          ) : (
            <p className="text-[12px] text-dim italic px-1">Você não tem repetidas que {friend.name} precise.</p>
          )}
        </div>

        <button
          onClick={onClose}
          disabled={match.pairs === 0}
          className={`w-full rounded-2xl py-3.5 font-display font-semibold text-[13px] tracking-wide transition-all active:scale-[.98]
            ${match.pairs > 0
              ? 'text-black'
              : 'glass text-dim cursor-not-allowed'}`}
          style={match.pairs > 0 ? { background:'linear-gradient(95deg,#00e5ff,#00ff87)', boxShadow:'0 8px 28px -8px rgba(0,255,135,.55)' } : {}}
        >
          {match.pairs > 0 ? `PROPOR TROCA · ${match.pairs}×${match.pairs}` : 'SEM TROCA EQUILIBRADA AINDA'}
        </button>
      </div>
    </div>
  );
}

/* ================================================================
   NAVEGAÇÃO INFERIOR
================================================================ */
const TABS = [
  { id:'album',   label:'Álbum',     icon: Icon.album },
  { id:'copies',  label:'Repetidas', icon: Icon.copies },
  { id:'matches', label:'Matches',   icon: Icon.swap },
];

function BottomNav({ tab, setTab, dupeTotal, matchAlert }) {
  const idx = TABS.findIndex(t => t.id === tab);
  return (
    <nav className="fixed bottom-0 inset-x-0 z-40 pb-[env(safe-area-inset-bottom)]">
      <div className="max-w-md mx-auto px-4 pb-3">
        <div className="glass-deep rounded-3xl p-1.5 relative">
          {/* pílula ativa deslizante */}
          <div className="absolute top-1.5 bottom-1.5 rounded-2xl transition-all duration-300"
               style={{ left:`calc(${idx} * (100% - 12px) / 3 + 6px)`, width:'calc((100% - 12px) / 3)',
                        background:'linear-gradient(140deg, rgba(0,229,255,.16), rgba(0,255,135,.08))',
                        border:'1px solid rgba(0,229,255,.3)', boxShadow:'0 0 20px -4px rgba(0,229,255,.3)',
                        transitionTimingFunction:'cubic-bezier(.3,1.4,.4,1)' }}/>
          <div className="relative grid grid-cols-3">
            {TABS.map(t => {
              const active = tab === t.id;
              const I = t.icon;
              return (
                <button key={t.id} onClick={() => setTab(t.id)}
                        className={`relative flex flex-col items-center gap-1 py-2.5 rounded-2xl transition-colors duration-300 ${active ? 'text-cyan26' : 'text-dim hover:text-white/80'}`}>
                  <span className="relative">
                    <I width="20" height="20"/>
                    {t.id === 'copies' && dupeTotal > 0 && (
                      <span className="absolute -top-1.5 -right-2.5 min-w-[16px] h-[16px] px-1 rounded-full bg-neon text-black font-mono font-bold text-[9px] flex items-center justify-center">{dupeTotal}</span>
                    )}
                    {t.id === 'matches' && matchAlert && (
                      <span className="absolute -top-0.5 -right-1 w-2 h-2 rounded-full bg-neon animate-pulse" style={{ boxShadow:'0 0 6px #00ff87' }}/>
                    )}
                  </span>
                  <span className={`text-[10px] tracking-wide ${active ? 'font-semibold' : ''}`}>{t.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </nav>
  );
}

/* ================================================================
   APP
================================================================ */
function App() {
  const [counts, setCounts] = usePersistedCounts();
  const [tab, setTabRaw] = useState('album');
  const [dir, setDir] = useState(1);
  const [openFriend, setOpenFriend] = useState(null);
  const prevIdx = useRef(0);

  const setTab = (next) => {
    const ni = TABS.findIndex(t => t.id === next);
    setDir(ni >= prevIdx.current ? 1 : -1);
    prevIdx.current = ni;
    setTabRaw(next);
    window.scrollTo({ top: 0 });
  };

  const inc = useCallback((id) => setCounts(c => ({ ...c, [id]: (c[id] || 0) + 1 })), [setCounts]);
  const dec = useCallback((id) => setCounts(c => {
    const n = Math.max(0, (c[id] || 0) - 1);
    const next = { ...c };
    if (n === 0) delete next[id]; else next[id] = n;
    return next;
  }), [setCounts]);

  const dupeTotal = useMemo(() => STICKERS.reduce((a, s) => a + Math.max(0, (counts[s.id] || 0) - 1), 0), [counts]);
  const matchAlert = useMemo(() => FRIENDS.some(f => computeMatch(f, counts).pairs > 0), [counts]);

  return (
    <div className="min-h-screen bg-void pb-32">
      {/* ticker topo */}
      <div className="sticky top-0 z-30 glass-deep border-x-0 border-t-0 overflow-hidden">
        <div className="anim-ticker flex whitespace-nowrap py-1.5 font-mono text-[10px] tracking-[.25em] uppercase text-dim">
          {[0,1].map(k => (
            <span key={k} className="flex shrink-0">
              {['STICKR·26','USA · MEX · CAN','48 seleções','288 figurinhas','104 jogos','troque agora','11.06.2026'].map((t, i) => (
                <span key={i} className="mx-6 flex items-center gap-6">{t}<span className="text-cyan26">◆</span></span>
              ))}
            </span>
          ))}
        </div>
      </div>

      {tab === 'album' && <ParallaxHeader counts={counts} active={tab === 'album'}/>}

      {/* conteúdo com transição de slide */}
      <main key={tab} className={dir > 0 ? 'anim-slideL' : 'anim-slideR'}>
        {tab === 'album'   && <AlbumTab counts={counts} onInc={inc} onDec={dec}/>}
        {tab === 'copies'  && <CopiesTab counts={counts} onInc={inc} onDec={dec}/>}
        {tab === 'matches' && <MatchesTab counts={counts} onOpenFriend={setOpenFriend}/>}
      </main>

      <BottomNav tab={tab} setTab={setTab} dupeTotal={dupeTotal} matchAlert={matchAlert}/>

      {openFriend && <TradeModal friend={openFriend} counts={counts} onClose={() => setOpenFriend(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
